<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The AllCraft Grid</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/gridcraft.ico" />
  <link data-trunk rel="rust" data-bin="gridcraft-web" data-wasm-opt="0" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #181a1d; }
    #gridcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #gridcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #c9c9ce; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="gridcraft_canvas"></canvas>
  <div id="gridcraft_loading">
    <div style="margin-bottom:12px;font-size:15px;font-weight:600;color:#ececef">Loading The AllCraft Grid&hellip;</div>
    <div style="width:240px;height:5px;background:#32353b;border-radius:999px;overflow:hidden">
      <div id="gc_load_bar" style="width:2%;height:100%;background:#22c55e;border-radius:999px;transition:width 0.12s ease-out"></div>
    </div>
    <div id="gc_load_pct" style="margin-top:8px;font-size:12px;color:#9ca3af;font-variant-numeric:tabular-nums">Starting&hellip;</div>
  </div>
</body>
</html>
